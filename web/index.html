<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Geofront — Mecha Tactical</title>
    <meta name="description" content="Mecha tactical city defence. Two frames. One block. Hold the cavern." />
    <meta name="theme-color" content="#0a0c10" />
    <meta property="og:type" content="x:game" />
    <meta property="og:title" content="Geofront" />
    <meta property="og:image" content="./og.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0a0c10;
        color: #c8d0dc;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
        cursor: grab;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        pointer-events: none;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8b929c;
        z-index: 2;
      }
      #boot .title { font-size: 1.05rem; }
      #boot .bar {
        width: min(220px, 56vw);
        height: 3px;
        background: #1c222c;
        border-radius: 2px;
        overflow: hidden;
      }
      #boot .fill {
        height: 100%;
        width: 8%;
        background: #c5ccd6;
        border-radius: 2px;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      #boot .hint {
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        color: #5c6470;
        text-transform: none;
      }
      @keyframes boot-pulse {
        0% { width: 8%; opacity: 0.55; }
        50% { width: 72%; opacity: 1; }
        100% { width: 8%; opacity: 0.55; }
      }
      #chrome {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      #chrome .row {
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }
      #chrome button {
        background: rgba(10, 12, 16, 0.78);
        color: #c5ccd6;
        border: 1px solid #2a3038;
        border-radius: 3px;
        padding: 6px 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      #chrome button:hover { border-color: #c5ccd6; }
      #chrome button.active {
        color: #0a0c10;
        background: #c5ccd6;
        border-color: #c5ccd6;
      }
      #chrome .hint {
        pointer-events: none;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #8b929c;
        text-shadow: 0 1px 2px #0a0c10;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="title">Geofront</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="hint">loading wasm</div>
    </div>
    <div id="chrome" hidden>
      <div class="row" id="views">
        <button type="button" data-view="surface">Surface</button>
        <button type="button" data-view="underground">Cavern</button>
        <button type="button" data-view="battle">Battle</button>
      </div>
      <div class="hint">WASD fly · drag look · Q/E height · wheel dolly</div>
    </div>
    <script>
      // Window-level input so the preview iframe actually receives WASD / drag.
      window.__gfKeys = Object.create(null);
      window.__gfPtr = { dx: 0, dy: 0, wheel: 0, down: false, x: 0, y: 0 };
      window.__gfCam = { yaw: 0, pitch: 0, speed: 0, x: 0, y: 0, z: 0 };
      window.__gfView = "";
      window.__gfMode = "";
      const params = new URLSearchParams(location.search);
      const startView = params.get("view");
      if (startView === "battle" || startView === "surface" || startView === "underground") {
        window.__gfView = startView;
        window.__gfMode = startView;
      }
      const GAME_KEYS = new Set([
        "KeyW", "KeyA", "KeyS", "KeyD", "KeyQ", "KeyE",
        "ShiftLeft", "ShiftRight", "Space", "ControlLeft", "ControlRight",
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      ]);
      window.addEventListener("keydown", (e) => {
        window.__gfKeys[e.code] = true;
        if (e.code === "ArrowUp") window.__gfKeys.KeyW = true;
        if (e.code === "ArrowDown") window.__gfKeys.KeyS = true;
        if (e.code === "ArrowLeft") window.__gfKeys.KeyA = true;
        if (e.code === "ArrowRight") window.__gfKeys.KeyD = true;
        if (GAME_KEYS.has(e.code)) e.preventDefault();
      });
      window.addEventListener("keyup", (e) => {
        window.__gfKeys[e.code] = false;
        if (e.code === "ArrowUp") window.__gfKeys.KeyW = false;
        if (e.code === "ArrowDown") window.__gfKeys.KeyS = false;
        if (e.code === "ArrowLeft") window.__gfKeys.KeyA = false;
        if (e.code === "ArrowRight") window.__gfKeys.KeyD = false;
      });
      const clearKeys = () => { window.__gfKeys = Object.create(null); };
      window.addEventListener("blur", clearKeys);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearKeys();
      });
      function bindCanvas(c) {
        if (c.dataset.gfBound) return;
        c.dataset.gfBound = "1";
        c.tabIndex = 0;
        c.addEventListener("pointerdown", (e) => {
          window.__gfPtr.down = true;
          try { c.setPointerCapture(e.pointerId); } catch (_) {}
          c.focus();
          c.style.cursor = "grabbing";
        });
        const end = () => {
          window.__gfPtr.down = false;
          c.style.cursor = "grab";
        };
        c.addEventListener("pointerup", end);
        c.addEventListener("pointercancel", end);
        c.addEventListener("pointermove", (e) => {
          window.__gfPtr.x = e.clientX;
          window.__gfPtr.y = e.clientY;
          if (!window.__gfPtr.down) return;
          window.__gfPtr.dx += e.movementX;
          window.__gfPtr.dy += e.movementY;
        });
        c.addEventListener("wheel", (e) => {
          window.__gfPtr.wheel += e.deltaY;
          e.preventDefault();
        }, { passive: false });
        c.addEventListener("contextmenu", (e) => e.preventDefault());
      }
      const obs = new MutationObserver(() => {
        document.querySelectorAll("canvas").forEach(bindCanvas);
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
      window.__controlsTest = {
        getYaw: () => (window.__gfCam && window.__gfCam.yaw) || 0,
        getSpeed: () => (window.__gfCam && window.__gfCam.speed) || 0,
        getPos: () => window.__gfCam
          ? { x: window.__gfCam.x, y: window.__gfCam.y, z: window.__gfCam.z }
          : { x: 0, y: 0, z: 0 },
        setKeys: (codes) => {
          window.__gfKeys = Object.create(null);
          for (const c of codes) window.__gfKeys[c] = true;
        },
      };
      const chrome = document.getElementById("chrome");
      const paintViews = () => {
        const mode = window.__gfMode || window.__gfView || "surface";
        document.querySelectorAll("#views button").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.view === mode);
        });
      };
      document.getElementById("views").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-view]");
        if (!btn) return;
        window.__gfView = btn.dataset.view;
        window.__gfMode = btn.dataset.view;
        paintViews();
        const url = new URL(location.href);
        url.searchParams.set("view", btn.dataset.view);
        history.replaceState(null, "", url);
      });
      paintViews();
      setInterval(paintViews, 500);
      window.__controlsTest.setView = (name) => {
        window.__gfView = name;
        window.__gfMode = name;
        paintViews();
      };
    </script>
    <script type="module">
      import init, { start } from "./pkg/geofront.js?v=srgb380";
      const boot = document.getElementById("boot");
      const hint = boot && boot.querySelector(".hint");
      const chrome = document.getElementById("chrome");
      const isControlFlow = (err) =>
        String(err).includes("Using exceptions for control flow");
      const ready = () => {
        boot?.remove();
        if (chrome) chrome.hidden = false;
        document.querySelectorAll("canvas").forEach((c) => {
          c.tabIndex = 0;
          c.focus();
        });
      };
      try {
        await init();
        if (hint) hint.textContent = "starting";
        start();
        ready();
      } catch (err) {
        if (isControlFlow(err)) {
          ready();
        } else if (boot) {
          boot.innerHTML = "";
          const msg = document.createElement("div");
          msg.style.cssText =
            "max-width:80vw;padding:1.5rem;text-align:center;letter-spacing:0.04em;color:#c45c5c;text-transform:none;line-height:1.5;pointer-events:auto;white-space:pre-wrap";
          msg.textContent = String(err);
          boot.appendChild(msg);
          boot.style.pointerEvents = "auto";
        } else {
          throw err;
        }
      }
    </script>
  </body>
</html>
