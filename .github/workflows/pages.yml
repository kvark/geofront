name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.92.0

      - name: Install wasm-bindgen-cli
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          VERSION=$(awk '/name = "wasm-bindgen"/{getline; if ($1=="version") {gsub(/"/,"",$3); print $3; exit}}' Cargo.lock)
          echo "wasm-bindgen $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build
        run: bash scripts/build-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
